<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <!--Titulo-->
        <h1>Consulta de endereço por CEP</h1>
    </header>

    <!-- Conecta o javascript no html -->
    <main>

        <form id="formConsulta">
            <label for="cep">CEP</label><br>
            <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="01001-000" required><br>
            
            <label for="cidade">Cidade</label><br>
            <input id="cidade" type="text" placeholder="São Paulo" required><br>

            <button type="submit">Consultar Endereço</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <script src="index.js"></script>

    </main>

    <footer>
        <p>Feedback</p>
        <p>Direitos Autorais</p>
    </footer>

</body>

</html>
